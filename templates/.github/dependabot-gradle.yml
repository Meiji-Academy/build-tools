# Location: .github/dependabot.yml
version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Tokyo"
    target-branch: "main"
    rebase-strategy: "auto"
    open-pull-requests-limit: 10
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "io.spring.dependency-management"
        update-types:
          - "minor"
          - "patch"
      kotlin-core:
        patterns:
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlinx:*"
        update-types:
          - "minor"
          - "patch"
      testing-tools:
        patterns:
          - "org.junit.jupiter:*"
          - "org.mockito:*"
          - "io.mockk:*"
        update-types:
          - "minor"
          - "patch"
      other-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"