# Location: .github/dependabot.yml
version: 2

registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.MEIJI_ACADEMY_PACKAGES_TOKEN }}

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Tokyo"
    target-branch: "main"
    rebase-strategy: "auto"
    open-pull-requests-limit: 10
    registries:
      - github-packages
    groups:
      nuxt-vue-core:
        patterns:
          - "nuxt*"
          - "vue*"
          - "@nuxtjs/*"
          - "@nuxt/*"
        update-types:
          - "minor"
          - "patch"
      linting-tooling:
        patterns:
          - "eslint*"
          - "prettier*"
          - "@typescript-eslint/*"
          - "typescript"
        update-types:
          - "minor"
          - "patch"
      other-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"