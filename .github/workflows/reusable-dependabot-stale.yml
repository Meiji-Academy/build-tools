name: "Reusable: Dependabot Stale Cleanup"
on:
  workflow_call:
    secrets:
      CHAT_WEBHOOK_URL:
        required: true

jobs:
  dependabot-stale:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Audit Stale PRs
        id: audit
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            
            let staleMessage = '';
            const sevenDaysAgo = new Date();
            sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
            
            for (const pr of prs) {
              if (pr.user.login === 'dependabot[bot]') {
                const updatedAt = new Date(pr.updated_at);
                if (updatedAt < sevenDaysAgo) {
                  staleMessage += `• <${pr.html_url}|PR #${pr.number}: ${pr.title}>\n`;
                }
              }
            }
            
            core.setOutput('stale_prs', staleMessage);

      - name: Send Google Chat Notification
        if: ${{ steps.audit.outputs.stale_prs != '' }}
        env:
          STALE_PRS: ${{ steps.audit.outputs.stale_prs }}
          WEBHOOK: ${{ secrets.CHAT_WEBHOOK_URL }}
        run: |
          TEXT=$(printf '⚠️ *Dependabot Stale Escalation (%s)*\nThe following PRs have been open for 7+ days:\n%s' "$GITHUB_REPOSITORY" "$STALE_PRS")
          jq -n --arg text "$TEXT" '{text: $text}' | curl -sf -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK"